name: Post-deploy smoke test

# Idea 190. Render deploys on push to main, and a deploy that boots but
# cannot serve is the failure this catches — the process is "up", the
# health check passes, and the actual pages are broken.
#
# Checks reachability and the security contract, not content: anything
# depending on a workspace's data would need credentials this workflow
# should not hold.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 */6 * * *" # four times a day, offset off the hour

# None at all: this job never checks out the repository. It issues curl
# requests against the deployed site and nothing else, so the token has
# no job to do here.
permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployment
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$BASE" ]; then
            # Not a skip. This job exists to answer "is the deployment
            # serving?", and a green tick that answered nothing is worse
            # than no job at all: it is the reason a broken deployment can
            # sit behind a wall of passing smoke tests for weeks. If this
            # repository has no deployment to probe, disable the workflow
            # deliberately rather than letting it report health it never
            # measured.
            echo "APP_BASE_URL is not configured, so nothing was probed." >&2
            echo "This is a failure, not a pass: set the secret, or disable this workflow." >&2
            exit 1
          fi

          fail=0
          check() {
            local path="$1" expected="$2"
            # The free tier sleeps; the first request can take ~a minute,
            # so the timeout is generous rather than the usual few seconds.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$BASE$path" || echo 000)
            if [ "$code" != "$expected" ]; then
              echo "FAIL $path -> $code (expected $expected)"
              fail=1
            else
              echo "ok   $path -> $code"
            fi
          }

          check /healthz 200
          check /readyz 200
          check /login 200
          # Unauthenticated access to data must stay refused. A deploy that
          # somehow opened this up is worth failing a build over.
          check /links 401

          echo "--- security headers ---"
          headers=$(curl -sS -D- -o /dev/null --max-time 90 "$BASE/login" || true)
          for header in "content-security-policy" "x-content-type-options"; do
            if echo "$headers" | grep -qi "^$header:"; then
              echo "ok   $header present"
            else
              echo "FAIL $header missing"
              fail=1
            fi
          done
          if echo "$headers" | grep -qi "unsafe-inline"; then
            echo "FAIL the deployed CSP contains 'unsafe-inline'"
            fail=1
          fi

          exit $fail

      # The probe above fetches /readyz and throws the body away. That body
      # is the only place the deployed schema revision is visible from
      # outside the host — /readyz reads alembic_version on every call,
      # precisely so the answer is right when it changed under a running
      # process. Without it a green smoke run cannot tell "the new revision
      # is serving" apart from "the old container still is", which is the
      # one question a post-deploy check exists to answer.
      #
      # Reported, not asserted against a fixed value: pinning a revision
      # here would fail every deploy that adds one. What is asserted is
      # that the field is there at all — absent means the database was not
      # built by alembic, which is a real finding rather than a blip.
      #
      # The body is {"status", "schema_version"} and carries no secret.
      # Registration policy is invite-only. A deployment can lose that by
      # nothing more dramatic than an environment variable going missing,
      # and every page above would stay green while signup silently
      # reopened — so it is probed rather than assumed.
      #
      # The probe cannot create an account whichever way it lands. The
      # invite gate is the first check in the handler; the password
      # strength rule is checked after it and still before the first
      # write. A request carrying no invite and a password that passes the
      # schema (>= 8 characters) but fails the strength rule therefore
      # separates the two states without any INSERT being reached:
      #
      #   403  the gate answered  -> invite-only, the configured policy
      #   422  the password rule answered -> the request needed no invite,
      #        so the gate is off and signup is open to anyone
      #
      # tests/test_auth_hardening.py pins that ordering, because if the
      # handler is ever reordered this probe stops being harmless.
      - name: Registration is invite-only
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 \
            -X POST "$BASE/auth/register" \
            -H 'content-type: application/json' \
            -d '{"email":"smoke-probe@invalid.example","password":"password","workspace_name":"smoke probe"}' \
            || echo 000)
          case "$code" in
            403)
              echo "ok   registration is invite-only -> 403"
              ;;
            422)
              if grep -q "breach lists" "$body"; then
                echo "::error::registration reached the password rule without an invite -> signup is OPEN. INVITE_CODE is not set on the deployment"
              else
                echo "::error::/auth/register answered 422 for a reason other than the password rule; the probe could not read the policy"
                cat "$body"
              fi
              exit 1
              ;;
            *)
              echo "::error::unexpected response from /auth/register -> $code"
              cat "$body"
              exit 1
              ;;
          esac

      - name: Report the deployed schema revision
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 90 "$BASE/readyz")
          echo "$body"
          if ! echo "$body" | grep -q '"schema_version"'; then
            echo "::error::/readyz did not report schema_version — the deployment is not reporting the revision it is serving"
            exit 1
          fi
