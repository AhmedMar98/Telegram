name: Collector

# Replaces a persistent background worker (which has no free Render tier)
# with a scheduled one-shot job. Each run: connect once with Telethon,
# fetch new messages for every active channel, classify and store new
# links, disconnect. Typically finishes in well under a minute.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TG_API_ID, TG_API_HASH, TG_SESSION_STRING, DATABASE_URL,
#   COLLECTOR_WORKSPACE_ID, FIELD_ENCRYPTION_KEY
# Optional: GROQ_API_KEY
#
# Each run also *discovers*: it asks the account which dialogs it has —
# channels, groups and private chats — and registers the ones this
# workspace does not know yet, so collection covers the account's actual
# Telegram rather than the subset somebody typed into the dashboard.
# Narrow or disable it with the COLLECTOR_SCOPE / COLLECTOR_AUTO_DISCOVER
# repository variables.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

# Checks out the code to run scripts/collect.py. Everything it writes
# goes to the database over DATABASE_URL, never through the token.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install collector dependencies
        run: pip install -r requirements-collector.txt

      - name: Run collector
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECTOR_WORKSPACE_ID: ${{ secrets.COLLECTOR_WORKSPACE_ID }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SECRET_KEY: "collector-process-does-not-serve-http"
          # Repository *variables*, not secrets: neither is a credential,
          # and a variable can be read back in the Actions UI, which is
          # what you want for a setting whose current value you may need
          # to check. Both fall back to the defaults in app/config.py
          # (discovery on, every kind in scope) when unset.
          COLLECTOR_AUTO_DISCOVER: ${{ vars.COLLECTOR_AUTO_DISCOVER }}
          COLLECTOR_SCOPE: ${{ vars.COLLECTOR_SCOPE }}
        run: python scripts/collect.py

  # Reports the outcome to the app's status board (ideas 181/183). Runs
  # whether the collection succeeded or failed — a board that only ever
  # hears about successes cannot show a failure.
  report:
    needs: collect
    if: always()
    uses: ./.github/workflows/report-run.yml
    with:
      name: collector
      conclusion: ${{ needs.collect.result }}
    secrets: inherit
