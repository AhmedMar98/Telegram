name: TEMP - Backup role authority check

# TEMPORARY. See Incident 3 / RLS Backup Authority Check.
#
# Manual-dispatch only, one fixed read-only query, three non-secret values
# printed. No schedule, no push trigger, no other event. Deleted (this file
# and scripts/_check_backup_role.py) immediately after the result is read.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print role authority (current_user, rolsuper, rolbypassrls only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: "role-check-process-does-not-serve-http"
        run: python scripts/_check_backup_role.py
