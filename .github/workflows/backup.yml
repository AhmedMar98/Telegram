name: Daily encrypted DB backup

# A pg_dump stored as a GitHub Actions artifact, independent of whoever
# hosts the database, so a forced recreation is a restore rather than a
# data loss.
#
# Two owner decisions changed this workflow:
#
#   * **Daily, not weekly.** A weekly cadence means up to seven days of
#     collection can be lost to one bad restore point. The job costs well
#     under a minute, so the only thing the weekly schedule was saving was
#     artifact storage.
#
#   * **Encrypted, always.** The dump contains every collected link and —
#     more to the point — the `telegram_accounts` rows. Those are already
#     encrypted at the field level, but a plain dump still hands an
#     attacker the whole database to work on offline. Symmetric AES-256
#     via gpg, which is preinstalled on ubuntu-latest, so this adds no
#     dependency and no cost.
#
# Required repository secrets:
#   DATABASE_URL       - same value used by the web service and collector
#   BACKUP_PASSPHRASE  - decrypts the dump; store it somewhere that is NOT
#                        this repository and NOT the same place as the
#                        database credentials. Losing it makes every
#                        backup permanently unreadable — that is the
#                        trade being made, and it is the right one.
#
# To restore — all three steps, in this order:
#   gpg --batch --decrypt --passphrase "$BACKUP_PASSPHRASE" \
#       -o backup.dump backup.dump.gpg
#   pg_restore --no-owner --no-privileges -d "$DATABASE_URL" backup.dump
#   python scripts/rearm_force_rls.py "$DATABASE_URL"
#
# The third step is not optional. The dump is taken with FORCE ROW LEVEL
# SECURITY briefly lifted (the only way pg_dump will produce a complete
# one), so it records FORCE as off. A restore therefore comes back with
# every row, every policy and ENABLE intact — and the table owner's RLS
# exemption handed back. Measured on a real restore: ENABLE survives
# 18/18, FORCE survives 0/18. Skip the re-arm and the recovered database
# isolates nothing from the application's own connection, silently, on
# the day you least want to find out.

on:
  schedule:
    # Daily. GitHub does not run scheduled workflows at the requested minute
    # and this repository's delay is not small: measured against git history,
    # four consecutive firings landed 4h33m-4h49m late. Treat the field as
    # "once a day", not as a delivery time, and read run_started_at when the
    # actual hour matters.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

# Least privilege: this job reads the repository and writes an artifact.
# It needs no write access to code, issues, or anything else.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    # The restore target, and the whole reason a backup can be believed.
    # An artifact that exists proves storage worked; only a restore proves
    # the thing in it is a database. Same major version as production so a
    # successful restore here means something about a real recovery.
    services:
      restore_target:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-verification-only
          POSTGRES_DB: restore_check
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # Before the RLS window opens, never during it: an apt install or a
      # pip resolve inside the window would hold tenant isolation off the
      # tables for however long the network felt like taking.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # pg_dump refuses to dump a server newer than itself, and the runner
      # ships whatever PostgreSQL client Ubuntu packages by default — 16 on
      # ubuntu-latest today, against a production server on 18.6. That is not
      # a transient error and no retry fixes it: every run failed the moment
      # it finished the connection handshake, which is why this workflow has
      # never produced a single artifact. The client has to be installed to
      # match the server's major version, and pinned here rather than left to
      # whatever the runner image happens to carry next month.
      #
      # PATH, not a rewritten pg_dump line: postgresql-common's wrapper picks
      # a version of its own, so putting 18's bin directory first is what
      # actually decides which binary the dump below runs.
      - name: Install a pg_dump matching the production server
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # postgresql-common's own dispatcher (/usr/bin/pg_dump) picks a
      # version by looking at what's running locally, which is nothing on
      # a fresh runner — so trusting the PATH order above without checking
      # is exactly the kind of assumption that produced the original
      # failure. This step is the difference between "should be 18" and
      # "is 18": it fails the job here, with one clear line, instead of
      # inside the dump with a server-version-mismatch error again.
      - name: Verify the selected pg_dump is actually version 18
        run: |
          set -euo pipefail
          which pg_dump
          pg_dump --version
          major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          if [ "$major" != "18" ]; then
            echo "pg_dump resolved to major version $major, not 18 — PATH did not pick" >&2
            echo "the installed client. Refusing to run a dump that will just fail" >&2
            echo "against the production server's version mismatch check again." >&2
            exit 1
          fi

      - name: Dump and encrypt database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Was exit 0 — "skipping backup" reported as a passing job. That
          # single line is why this workflow showed three green runs that had
          # produced nothing at all, and why nobody knew there had never been
          # a backup. A backup job with no database to back up has failed at
          # the only thing it exists to do.
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is not set, so no backup was taken." >&2
            echo "This is a failure, not a skip: set the secret, or disable this workflow." >&2
            exit 1
          fi

          # Deliberately a hard failure, not a fallback to an unencrypted
          # upload. A backup that quietly downgrades itself to plaintext is
          # the same class of defect as a service that quietly starts with
          # a published key: it looks healthy and protects nothing.
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "BACKUP_PASSPHRASE is not set. Refusing to upload an unencrypted dump." >&2
            echo "Set the secret, or disable this workflow deliberately." >&2
            exit 1
          fi

          # Not a bare pg_dump: eighteen tables carry FORCE ROW LEVEL
          # SECURITY, which strips this role's owner exemption, and pg_dump
          # correctly refuses to write a dump it knows would be filtered.
          # The script lifts FORCE on exactly those tables, dumps, and puts
          # FORCE back — verified, and whether or not the dump succeeded.
          python scripts/backup_full_dump.py "$DATABASE_URL" backup.dump

          # --batch with the passphrase on stdin: passing it as an argument
          # would put it in the process list, which other steps can read.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output backup.dump.gpg \
            backup.dump

          # The plaintext dump must not survive into the upload step.
          shred -u backup.dump 2>/dev/null || rm -f backup.dump

      # The step that decides whether any of the above meant anything.
      # Everything before this proves a file was produced; this proves the
      # file is a database — decrypted with the same secret a real recovery
      # would use, restored into a clean PostgreSQL 18, and then read.
      #
      # Deliberately decrypts the artifact rather than reusing the dump from
      # the step above: the pre-encryption file was never in doubt. What is
      # in doubt is whether the *encrypted* thing that gets stored can be
      # turned back into rows, and only decrypting it answers that.
      - name: Verify the backup restores into an isolated PostgreSQL 18
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGPASSWORD: restore-verification-only
        run: |
          set -euo pipefail

          if [ ! -s backup.dump.gpg ]; then
            echo "No encrypted backup to verify — nothing was produced." >&2
            exit 1
          fi
          echo "artifact bytes: $(stat -c%s backup.dump.gpg)"

          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --decrypt \
            --passphrase-fd 0 \
            --output restore-check.dump \
            backup.dump.gpg
          echo "decrypt: OK ($(stat -c%s restore-check.dump) bytes)"

          pg_restore --no-owner --no-privileges --exit-on-error \
            -h 127.0.0.1 -p 5433 -U postgres -d restore_check \
            restore-check.dump
          echo "restore: OK"

          q() { psql -h 127.0.0.1 -p 5433 -U postgres -d restore_check -tAc "$1"; }

          tables=$(q "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "restored tables: $tables"
          [ "$tables" -gt 0 ] || { echo "restore produced no tables" >&2; exit 1; }

          # The revision is the one fact that says which schema this is. A
          # restore that came back without it is not this database.
          revision=$(q "SELECT version_num FROM alembic_version")
          echo "alembic_version: $revision"
          [ -n "$revision" ] || { echo "no alembic_version in the restore" >&2; exit 1; }

          # Encrypted columns: present, and still carrying ciphertext of the
          # length the source had. Never decrypted, never printed — the point
          # is that a restore preserved them, not what they say.
          for pair in "telegram_accounts:session_string" "users:totp_secret" "workspaces:webhook_url"; do
            t="${pair%%:*}"; c="${pair##*:}"
            exists=$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='$t' AND column_name='$c'")
            [ "$exists" = "1" ] || { echo "encrypted column $t.$c missing from the restore" >&2; exit 1; }
            filled=$(q "SELECT count(*) FROM $t WHERE $c IS NOT NULL AND $c <> ''")
            echo "  $t.$c present, non-empty rows: $filled"
          done

          # Every protected table has to have come back too, or the window
          # did not do what it was opened for.
          for t in $(python -c "from app.rls import PROTECTED_TABLES; print(' '.join(PROTECTED_TABLES))"); do
            n=$(q "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='$t'")
            [ "$n" = "1" ] || { echo "protected table $t missing from the restore" >&2; exit 1; }
          done
          echo "all 18 protected tables restored"

          # The gap a restore leaves, and the proof the documented fix for
          # it works. Asserted before re-arming so this stays a measurement
          # rather than a belief about pg_dump's behaviour.
          forced_before=$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relforcerowsecurity")
          echo "FORCE RLS as restored: $forced_before (expected 0 — the dump was taken with the window open)"

          DATABASE_URL="postgresql://postgres:restore-verification-only@127.0.0.1:5433/restore_check" \
            python scripts/rearm_force_rls.py "postgresql://postgres:restore-verification-only@127.0.0.1:5433/restore_check"

          forced_after=$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relforcerowsecurity")
          echo "FORCE RLS after re-arm: $forced_after"
          [ "$forced_after" = "18" ] || { echo "re-arm left $forced_after/18 forced" >&2; exit 1; }

          shred -u restore-check.dump 2>/dev/null || rm -f restore-check.dump
          echo "RESTORE-VERIFIED"

      - uses: actions/upload-artifact@v5
        if: hashFiles('backup.dump.gpg') != ''
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump.gpg
          # Thirty daily restore points. Rotation is GitHub's expiry rather
          # than a script this project has to maintain and get right.
          retention-days: 30

  report:
    needs: backup
    if: always()
    uses: ./.github/workflows/report-run.yml
    with:
      name: backup
      conclusion: ${{ needs.backup.result }}
    secrets: inherit
