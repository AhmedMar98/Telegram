name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app scripts

      - name: bandit (security scan)
        run: bandit -r app scripts tests -lll -iii

      # Catches known CVEs in pinned dependencies. A one-off audit rots the
      # moment a new advisory lands, so it runs on every push rather than
      # whenever somebody remembers to check.
      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-collector.txt

      - name: Alembic migrations apply and match the models
        env:
          DATABASE_URL: "sqlite:///./_ci_alembic.db"
          SECRET_KEY: "ci-secret"
        run: |
          alembic upgrade head
          # Fails if the ORM models have drifted from the migration chain,
          # i.e. someone changed a model without writing the migration.
          alembic check
          rm -f _ci_alembic.db

      - name: pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
        run: pytest -q --cov=app --cov=scripts --cov-report=term-missing

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: .coverage

  postgres-search:
    # The SQLite suite exercises the ILIKE fallback. Production runs Postgres
    # and takes the to_tsvector path instead, which once silently returned
    # nothing for URL fragments. This job covers that path against a real
    # Postgres so the difference cannot hide a defect again.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations apply cleanly to Postgres
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/linktest"
          SECRET_KEY: "ci-secret"
        run: |
          alembic upgrade head
          alembic check

      - name: Full-text search tests against Postgres
        env:
          PG_TEST_DSN: "postgresql://postgres:postgres@localhost:5432/linktest"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
        run: pytest tests/test_postgres_search.py -q

      # Row-level security has to be tested as an UNPRIVILEGED role, and
      # that is not a detail. A superuser bypasses RLS entirely — FORCE and
      # all — so running these tests as `postgres`, the way the step above
      # does, would pass every assertion while the policies did nothing.
      # Hence a separate database owned by a role created here.
      - name: Create an unprivileged role and a database it owns
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d linktest -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_role LOGIN PASSWORD 'app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -d linktest -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE rlstest OWNER app_role;"

      - name: Migrations apply as the unprivileged owner
        env:
          DATABASE_URL: "postgresql://app_role:app_pw@localhost:5432/rlstest"
          SECRET_KEY: "ci-secret"
        run: alembic upgrade head

      # tests/test_rls.py skips itself when RLS_TEST_DSN is unset. That is
      # correct locally and wrong here: a typo in the DSN would leave this
      # job green having asserted nothing, which is the exact failure this
      # whole feature is about. pytest exits 0 on a fully skipped file, so
      # the skip has to be caught by reading the summary.
      - name: Row-level security tests
        shell: bash
        env:
          RLS_TEST_DSN: "postgresql://app_role:app_pw@localhost:5432/rlstest"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
        run: |
          set -euo pipefail
          pytest tests/test_rls.py -q | tee rls.out
          if grep -qi "skipped" rls.out; then
            echo "::error::RLS tests skipped — RLS_TEST_DSN never reached pytest, so nothing was verified"
            exit 1
          fi
          grep -qE "[0-9]+ passed" rls.out
