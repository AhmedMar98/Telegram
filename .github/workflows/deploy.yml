name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: expose ORACLE_HOST as a job output so subsequent steps can
  # use it in `if:` conditions. Step-level `env:` variables cannot be
  # referenced from the same step's `if:` (GH Actions evaluates `if`
  # before the step's env context is built), which was silently making
  # every step skip in the previous version of this workflow.
  check-config:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      - id: gate
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          if [ -n "$ORACLE_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORACLE_HOST secret not set — deploy will be skipped."
            echo "To enable auto-deploy, set repository secrets:"
            echo "  - ORACLE_HOST (Oracle Cloud VM IP)"
            echo "  - ORACLE_SSH_KEY (private SSH key)"
            echo "  - ORACLE_USER (default: ubuntu)"
            echo "  - ORACLE_DEPLOY_PATH (default: /home/ubuntu/link-intelligence)"
          fi

  deploy-oracle:
    runs-on: ubuntu-latest
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${ORACLE_SSH_KEY}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts

      - name: Sync code to Oracle Cloud
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH || '/home/ubuntu/link-intelligence' }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='.env' \
            --exclude='*.session' \
            -e "ssh -i ~/.ssh/oracle_key" \
            ./ "${ORACLE_USER}@${ORACLE_HOST}:${ORACLE_DEPLOY_PATH}/"

      - name: Restart services on remote
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH || '/home/ubuntu/link-intelligence' }}
        run: |
          # Quoting the heredoc terminator makes the remote shell evaluate
          # $VARS on the remote side (previously they were expanded locally
          # by bash -c, which produced an empty ${ORACLE_DEPLOY_PATH} once
          # the outer shell dropped it).
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER}@${ORACLE_HOST}" \
              DEPLOY_PATH="${ORACLE_DEPLOY_PATH}" bash <<'REMOTE'
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            if [ ! -d venv ]; then python3 -m venv venv; fi
            # shellcheck disable=SC1091
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            python scripts/init_db.py
            if systemctl --user list-unit-files | grep -q link-intel; then
              systemctl --user restart link-intel-web
              systemctl --user restart link-intel-worker
            else
              pkill -f "uvicorn app.main" || true
              pkill -f "scripts/run_worker.py" || true
              mkdir -p logs
              nohup python scripts/run_web.py > logs/web.log 2>&1 &
              nohup python scripts/run_worker.py all > logs/worker.log 2>&1 &
            fi
          REMOTE
