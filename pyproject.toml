[project]
name = "link-intelligence-platform"
version = "1.0.0"
description = "Zero-cost Telegram link collection, classification, and search platform."
requires-python = ">=3.11"

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    # Same reasoning as the FastAPI helpers above: `roles.require("x")`
    # builds a fresh closure and touches nothing, so evaluating it once at
    # import time — which is what a default argument does — is exactly the
    # intent. B008 exists for defaults that are mutable or that do work,
    # and this is neither.
    "app.roles.require",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
