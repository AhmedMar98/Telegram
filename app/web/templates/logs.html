{% extends "base.html" %}
{% block title %}Live Logs — Link Intelligence{% endblock %}

{% block content %}
<h1 class="page-title">📡 Live Logs</h1>

<div class="log-controls">
    <label>
        <input type="checkbox" id="autoScroll" checked> تمرير تلقائي
    </label>
    <label>
        Level:
        <select id="levelFilter">
            <option value="">ALL</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO" selected>INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
        </select>
    </label>
    <button onclick="clearLogs()" class="btn btn-secondary">مسح</button>
    <span id="connectionStatus" class="status-dot connecting">●</span>
</div>

<div id="logContainer" class="log-container"></div>
{% endblock %}

{% block scripts %}
<script>
const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = `${wsProtocol}//${location.host}/ws/logs`;
let ws = null;
let levelFilter = '';
let autoScroll = true;

document.getElementById('levelFilter').addEventListener('change', (e) => {
    levelFilter = e.target.value;
    // Re-render existing logs
    reapplyFilter();
});

document.getElementById('autoScroll').addEventListener('change', (e) => {
    autoScroll = e.target.checked;
});

function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
        document.getElementById('connectionStatus').className = 'status-dot connected';
    };
    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            appendLog(data);
        } catch (e) {
            console.error('Parse error:', e);
        }
    };
    ws.onclose = () => {
        document.getElementById('connectionStatus').className = 'status-dot disconnected';
        setTimeout(connect, 3000);  // auto-reconnect
    };
    ws.onerror = () => {
        document.getElementById('connectionStatus').className = 'status-dot disconnected';
    };
}

function appendLog(entry) {
    if (levelFilter && entry.level !== levelFilter) return;
    const container = document.getElementById('logContainer');
    const line = document.createElement('div');
    line.className = `log-line log-${entry.level.toLowerCase()}`;
    line.dataset.level = entry.level;
    line.innerHTML = `
        <span class="log-time">${entry.time}</span>
        <span class="log-level">${entry.level}</span>
        <span class="log-name">${entry.name}</span>
        <span class="log-message">${escapeHtml(entry.message)}</span>
    `;
    container.appendChild(line);
    // Keep last 500 lines
    while (container.children.length > 500) {
        container.removeChild(container.firstChild);
    }
    if (autoScroll) {
        container.scrollTop = container.scrollHeight;
    }
}

function reapplyFilter() {
    const lines = document.querySelectorAll('.log-line');
    lines.forEach(line => {
        if (!levelFilter || line.dataset.level === levelFilter) {
            line.style.display = '';
        } else {
            line.style.display = 'none';
        }
    });
}

function clearLogs() {
    document.getElementById('logContainer').innerHTML = '';
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

connect();
</script>
{% endblock %}
