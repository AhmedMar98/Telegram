{% extends "base.html" %}
{% block title %}لوحة التحكم{% endblock %}
{% block content %}
<h2>البحث في الروابط</h2>
<div class="row">
  <input id="q" placeholder="ابحث..." style="flex: 1;">
  <select id="category">
    <option value="">كل التصنيفات</option>
    {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
  </select>
  <button onclick="search()">بحث</button>
  <button onclick="exportCsv()">تصدير CSV</button>
  <button onclick="exportJson()">تصدير JSON</button>
</div>
<div class="row" style="align-items:center;">
  <button onclick="bulkRecategorize()">نقل كل النتائج الحالية إلى تصنيف آخر</button>
  <button onclick="bulkDelete()">حذف كل النتائج الحالية</button>
</div>
<p id="stats" class="muted"></p>
<div id="results"></div>
<div class="row" style="align-items:center;">
  <button id="prevBtn" onclick="changePage(-1)">السابق</button>
  <span id="pageInfo" class="muted"></span>
  <button id="nextBtn" onclick="changePage(1)">التالي</button>
</div>

<h2>إضافة روابط يدوياً</h2>
<p class="muted">الصق أي نص يحتوي روابط — رابط واحد أو رسالة كاملة أو قائمة. سيُستخرج كل رابط ويُصنَّف تلقائياً.</p>
<div class="row" style="flex-direction: column;">
  <textarea id="pasteBox" rows="4" placeholder="الصق الروابط أو النص هنا..." style="width:100%; font-family:inherit; font-size:1rem; padding:.5rem; border-radius:.4rem; border:1px solid #8888;"></textarea>
  <button onclick="addLinks()">إضافة وتصنيف</button>
  <p id="addResult" class="muted"></p>
</div>

<h2>القنوات</h2>
<div class="row">
  <input id="chId" placeholder="معرّف القناة (tg_channel_id)">
  <input id="chUsername" placeholder="username (اختياري)">
  <button onclick="addChannel()">إضافة قناة</button>
</div>
<div id="channels"></div>

<h2>ربط البوت</h2>
<button onclick="linkBot()">توليد رمز ربط للبوت</button>
<p id="botCode" class="muted"></p>

<h2>الحساب</h2>
<div class="row" style="flex-direction: column;">
  <input id="curPass" type="password" placeholder="كلمة المرور الحالية">
  <input id="newPass" type="password" placeholder="كلمة المرور الجديدة (٨ أحرف على الأقل)">
  <button onclick="changePassword()">تغيير كلمة المرور</button>
  <p id="passResult" class="muted"></p>
  <button onclick="logoutAll()">تسجيل الخروج من كل الأجهزة</button>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthenticated"); }
  return res;
}

async function loadStats() {
  const res = await api("/links/stats");
  const data = await res.json();
  document.getElementById("stats").textContent =
    `إجمالي الروابط: ${data.total_links} | القنوات: ${data.total_channels}`;
}

const CATEGORIES = {{ categories | tojson }};
let currentPage = 1;

function changePage(delta) {
  currentPage = Math.max(1, currentPage + delta);
  search(false);
}

async function removeLink(id) {
  if (!confirm("حذف هذا الرابط؟")) return;
  await api(`/links/${id}`, { method: "DELETE" });
  search(false);
  loadStats();
}

async function recategorize(id, category) {
  await api(`/links/${id}`, { method: "PATCH", body: JSON.stringify({ category }) });
  loadStats();
}

function exportCsv() {
  const category = document.getElementById("category").value;
  window.location = "/links/export.csv" + (category ? `?category=${encodeURIComponent(category)}` : "");
}

function exportJson() {
  const category = document.getElementById("category").value;
  window.location = "/links/export.json" + (category ? `?category=${encodeURIComponent(category)}` : "");
}

function currentFilter() {
  return { q: document.getElementById("q").value || null, category: document.getElementById("category").value || null };
}

async function bulkDelete() {
  const filter = currentFilter();
  if (!confirm("حذف كل الروابط المطابقة للفلتر الحالي؟ لا يمكن التراجع.")) return;
  const res = await api("/links/bulk/delete", { method: "POST", body: JSON.stringify(filter) });
  const data = await res.json();
  alert(`تم حذف ${data.affected} رابط.`);
  search(false);
  loadStats();
}

async function bulkRecategorize() {
  const filter = currentFilter();
  const new_category = prompt("التصنيف الجديد لكل النتائج المطابقة للفلتر الحالي:\n" + CATEGORIES.join(", "));
  if (!new_category) return;
  if (!CATEGORIES.includes(new_category)) { alert("تصنيف غير معروف."); return; }
  const res = await api("/links/bulk/recategorize", {
    method: "POST",
    body: JSON.stringify(Object.assign({}, filter, { new_category })),
  });
  const data = await res.json();
  alert(`تم تحديث ${data.affected} رابط.`);
  search(false);
}

async function search(resetPage = true) {
  if (resetPage) currentPage = 1;
  const q = document.getElementById("q").value;
  const category = document.getElementById("category").value;
  const params = new URLSearchParams();
  params.set("page", currentPage);
  if (q) params.set("q", q);
  if (category) params.set("category", category);
  const res = await api("/links?" + params.toString());
  const data = await res.json();
  const el = document.getElementById("results");
  el.innerHTML = data.items.map(i =>
    `<div class="card">
       <a href="${i.url}" target="_blank" rel="noopener">${i.url}</a>
       <div style="margin-top:.5rem; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;">
         <select onchange="recategorize(${i.id}, this.value)">
           ${CATEGORIES.map(c => `<option value="${c}" ${c === i.category ? "selected" : ""}>${c}</option>`).join("")}
         </select>
         <span class="muted">${i.classified_by} · ${(i.confidence*100).toFixed(0)}%</span>
         <button onclick="removeLink(${i.id})" style="margin-inline-start:auto;">حذف</button>
       </div>
     </div>`
  ).join("") || "<p class='muted'>لا نتائج</p>";
  document.getElementById("pageInfo").textContent =
    data.total === 0 ? "" : `صفحة ${data.page} — عرض ${data.items.length} من ${data.total}`;
  document.getElementById("prevBtn").disabled = data.page <= 1;
  document.getElementById("nextBtn").disabled = data.page * data.page_size >= data.total;
}

async function loadChannels() {
  const res = await api("/channels");
  const data = await res.json();
  document.getElementById("channels").innerHTML = data.map(c =>
    `<div class="card">${c.title || c.username || c.tg_channel_id} <span class="muted">${c.is_active ? "نشطة" : "متوقفة"}</span></div>`
  ).join("") || "<p class='muted'>لا توجد قنوات مضافة بعد</p>";
}

async function addChannel() {
  const tg_channel_id = document.getElementById("chId").value.trim();
  const username = document.getElementById("chUsername").value.trim() || null;
  if (!tg_channel_id) return;
  await api("/channels", { method: "POST", body: JSON.stringify({ tg_channel_id, username }) });
  document.getElementById("chId").value = "";
  document.getElementById("chUsername").value = "";
  loadChannels();
}

async function addLinks() {
  const box = document.getElementById("pasteBox");
  const text = box.value.trim();
  const out = document.getElementById("addResult");
  if (!text) { out.textContent = "الصق نصاً أولاً."; return; }
  out.textContent = "جارٍ التصنيف...";
  const res = await api("/links", { method: "POST", body: JSON.stringify({ text }) });
  const data = await res.json();
  if (data.found === 0) {
    out.textContent = "لم يُعثر على أي رابط في النص.";
    return;
  }
  out.textContent = `وُجد ${data.found} رابط — أُضيف ${data.stored} جديد، و${data.duplicates} موجود مسبقاً.`;
  box.value = "";
  loadStats();
  search();
  loadChannels();
}

async function linkBot() {
  const res = await api("/bot/link-code", { method: "POST" });
  const data = await res.json();
  document.getElementById("botCode").textContent = data.instructions;
}

async function changePassword() {
  const current_password = document.getElementById("curPass").value;
  const new_password = document.getElementById("newPass").value;
  const out = document.getElementById("passResult");
  const res = await api("/auth/change-password", { method: "POST", body: JSON.stringify({ current_password, new_password }) });
  if (!res.ok) {
    const err = await res.json();
    out.textContent = err.detail || "فشل تغيير كلمة المرور.";
    return;
  }
  const data = await res.json();
  out.textContent = `تم تغيير كلمة المرور. تم تسجيل الخروج من ${data.other_sessions_revoked} جلسة أخرى.`;
  document.getElementById("curPass").value = "";
  document.getElementById("newPass").value = "";
}

async function logoutAll() {
  if (!confirm("تسجيل الخروج من كل الأجهزة بما فيها هذا الجهاز؟")) return;
  await api("/auth/logout-all", { method: "POST" });
  window.location.href = "/login";
}

loadStats();
search();
loadChannels();
</script>
{% endblock %}
