{% extends "base.html" %}
{% block title %}تسجيل{% endblock %}
{% block content %}
<h2>إنشاء مساحة عمل جديدة</h2>
<div class="card">
  <form id="regForm" class="row" style="flex-direction: column;">
    <input name="workspace_name" placeholder="اسم مساحة العمل" required>
    <input type="email" name="email" placeholder="البريد الإلكتروني" required>
    <input type="password" name="password" placeholder="كلمة المرور (٨ أحرف على الأقل)" minlength="8" required>
    {% if invite_required %}
    <input name="invite_code" placeholder="رمز الدعوة" required>
    {% endif %}
    <button type="submit">إنشاء الحساب</button>
    <p id="err" class="error"></p>
  </form>
</div>
<script>
document.getElementById("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const body = {
    workspace_name: form.get("workspace_name"),
    email: form.get("email"),
    password: form.get("password"),
  };
  if (form.get("invite_code")) body.invite_code = form.get("invite_code");
  const res = await fetch("/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.ok) { window.location.href = "/dashboard"; }
  else { const data = await res.json(); document.getElementById("err").textContent = data.detail || "فشل التسجيل"; }
});
</script>
{% endblock %}
