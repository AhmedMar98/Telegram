<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}منصة استخبارات الروابط{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; line-height: 1.6; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  nav a { margin-inline-start: 1rem; text-decoration: none; }
  input, select, button { font-size: 1rem; padding: .5rem; border-radius: .4rem; border: 1px solid #8888; }
  button { cursor: pointer; }
  .card { border: 1px solid #8884; border-radius: .6rem; padding: 1rem; margin-bottom: .75rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .muted { opacity: .7; font-size: .9rem; }
  .tag { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; background: #8882; font-size: .8rem; }
  .error { color: #d33; }
</style>
</head>
<body>
<header>
  <strong>🔗 منصة استخبارات الروابط</strong>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/login">دخول</a>
    <a href="/register">تسجيل</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
