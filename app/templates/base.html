<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}منصة استخبارات الروابط{% endblock %}</title>
<script>
  // Applied before first paint: reading the stored theme after the body
  // renders would show a flash of the wrong palette on every load.
  // "system" is stored as the absence of the attribute, so the CSS media
  // query stays in charge unless the person made an explicit choice.
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* private mode: fall back to the OS preference */ }
  })();
</script>
<style>
  /* Light palette on bare :root, so every token always has a definition.
     Dark is applied twice — once for the OS preference (guarded so an
     explicit light choice still wins) and once for the explicit choice —
     which is what lets the toggle override the system in both directions. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    /* #919191, not the original #d0d0d0: measured against WCAG 2.1 AA
       non-text contrast (1.4.11), the old value scored 1.54 against the
       page and 1.51 against a card, where the minimum is 3.0 — form field
       boundaries were effectively invisible to low-vision users. This value
       is the lightest grey that clears 3.0 against both surfaces (3.15 and
       3.02), so the visual weight changes as little as the standard allows. */
    --border: #919191;
    --card-bg: #fafafa;
    --tag-bg: #ececec;
    --accent: #0b57d0;
    --danger: #c1121f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14171c;
      --fg: #e6e6e6;
      --muted: #a0a6b0;
      /* Same 1.4.11 fix as the light palette: #333a44 measured 1.56/1.51. */
      --border: #636a74;
      --card-bg: #1b1f26;
      --tag-bg: #2a3038;
      --accent: #7ca9f5;
      --danger: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --fg: #e6e6e6;
    --muted: #a0a6b0;
    --border: #636a74;
    --card-bg: #1b1f26;
    --tag-bg: #2a3038;
    --accent: #7ca9f5;
    --danger: #ff6b6b;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    max-width: 900px; margin: 0 auto; padding: 1rem; line-height: 1.6;
    background: var(--bg); color: var(--fg);
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: .5rem; flex-wrap: wrap; }
  nav a { margin-inline-start: 1rem; text-decoration: none; color: var(--accent); }
  a { color: var(--accent); }
  input, select, button, textarea {
    font-size: 1rem; padding: .5rem; border-radius: .4rem;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    /* Touch targets: WCAG 2.5.8 asks for 24x24 CSS px minimum, and the
       icon buttons (★, 🗄, ×) were under that on a phone once their text
       was a single character. min-height/min-width rather than padding so
       the change cannot be undone by a more specific padding rule. */
    min-height: 2.25rem; min-width: 2.25rem;
  }
  button { cursor: pointer; }

  /* Keyboard focus must be visible on every interactive element. The
     browser default outline is removed by some resets and is invisible
     against the dark palette anyway; this is defined once, in terms of the
     accent token, so it works in both themes. :focus-visible rather than
     :focus keeps it off mouse clicks, where it reads as a bug. */
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: .3rem;
  }

  /* A URL is Latin text inside an RTL document. Without an explicit
     direction the bidi algorithm reorders its trailing punctuation and
     path segments, so "example.com/a-b.pdf?x=1" can render with pieces in
     the wrong places — the link looks wrong even though it is stored
     correctly. unicode-bidi isolates it from the surrounding Arabic. */
  .ltr, a[href^="http"] { direction: ltr; unicode-bidi: isolate; display: inline-block; }

  /* Screen-reader-only text: present in the accessibility tree, invisible
     on screen. Used to give icon-only buttons a real name and to announce
     status changes. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Respect a system-level request to reduce motion. Nothing here animates
     heavily today, but the rule is the cheap half of honouring it and it
     also disables smooth scrolling introduced by the keyboard shortcuts. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
  .card { border: 1px solid var(--border); background: var(--card-bg); border-radius: .6rem; padding: 1rem; margin-bottom: .75rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .tag { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; background: var(--tag-bg); font-size: .8rem; }
  .error { color: var(--danger); }
  /* Grid view. auto-fill with a minimum column width rather than a fixed
     column count, so the same rule works from a phone (one column) to a
     wide screen without a media query per breakpoint. */
  .grid-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .75rem; }
  .grid-results .card { margin-bottom: 0; overflow-wrap: anywhere; }
  /* Compact density: one link per row for scanning a long result set.
     Padding and margin shrink; nothing is hidden by CSS — the card itself
     omits the context line and origin badges in this mode, so a screen
     reader is not told about content that is only visually absent. */
  .card.compact { padding: .4rem .6rem; margin-bottom: .3rem; }
  /* The undo bar's layout lives here, not in a style attribute. An inline
     display:flex outranks the user-agent's [hidden] { display: none }, so
     the bar stayed in the layout and its "undo" button stayed in the tab
     order while invisible — a keyboard user could focus and press a button
     they could not see. [hidden] is restated first so the guarantee does
     not depend on rule order. */
  [hidden] { display: none !important; }
  .undo-bar { display: flex; gap: .5rem; align-items: center; }
  /* Search-term highlight. Defined against the theme tokens so it stays
     readable in dark mode, where a browser's default yellow-on-white
     <mark> becomes unreadable. */
  mark { background: var(--tag-bg); color: var(--fg); font-weight: 600; padding: 0 .15rem; border-radius: .2rem; }
  #themeToggle { padding: .35rem .6rem; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <strong>🔗 منصة استخبارات الروابط</strong>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/login">دخول</a>
    <a href="/register">تسجيل</a>
    <button id="themeToggle" type="button" onclick="cycleTheme()" title="تبديل المظهر"></button>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  // Three states, not two: "system" must stay reachable so the page can go
  // back to following the OS after someone has overridden it once.
  var THEMES = ["system", "light", "dark"];
  var THEME_LABEL = { system: "🖥️ تلقائي", light: "☀️ فاتح", dark: "🌙 داكن" };

  function storedTheme() {
    try { return localStorage.getItem("theme") || "system"; } catch (e) { return "system"; }
  }

  function applyTheme(theme) {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    try {
      if (theme === "system") localStorage.removeItem("theme");
      else localStorage.setItem("theme", theme);
    } catch (e) { /* private mode: the choice just does not persist */ }
    var btn = document.getElementById("themeToggle");
    if (btn) btn.textContent = THEME_LABEL[theme];
  }

  function cycleTheme() {
    applyTheme(THEMES[(THEMES.indexOf(storedTheme()) + 1) % THEMES.length]);
  }

  applyTheme(storedTheme());
</script>
</body>
</html>
