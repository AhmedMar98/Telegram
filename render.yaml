# Render Blueprint — zero-cost deployment, native Python runtime, no Docker.
#
# Free-tier facts this blueprint is built around (verified independently
# before writing this file; see docs/01-critical-analysis.md Appendix C):
#   - Web service "free" plan: 750 instance-hours/month, sleeps after
#     ~15 minutes idle, ~1 minute cold start on the next request.
#   - Postgres "free" plan: 1 GB storage, expires 30 days after creation
#     (with a grace period) — mitigated by the weekly backup workflow in
#     .github/workflows/backup.yml, which is independent of Render.
#   - There is NO free background-worker plan. That is why the collector
#     is a scheduled GitHub Actions job (scripts/collect.py), not a
#     second Render service.
#
# Deploy: connect this repo on https://dashboard.render.com/blueprints
# and Render reads this file automatically. No Dockerfile anywhere.

services:
  - type: web
    name: link-intel-web
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Idea 187 (the running code identifies itself) needs NOTHING here.
      #
      # RENDER_GIT_COMMIT and RENDER_SERVICE_NAME are reserved variables
      # Render injects into every service by itself, and app/config.py
      # reads them straight from the environment with a None fallback.
      # This block used to declare them with `fromService` pointing at
      # this very service, which Render rejects outright:
      #
      #   services[0].envVars[2] cannot refer to reference env vars
      #   RENDER_GIT_COMMIT for service (web link-intel-web)
      #
      # and the whole blueprint sync fails with it — so the cost was not a
      # missing version string, it was no deploy at all. Declaring a
      # platform-provided variable is not redundancy; it is an error.
      - key: DATABASE_URL
        fromDatabase:
          name: link-intel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false
      # Not generateValue, and the difference matters. This key must be the
      # SAME string here and in the GitHub Actions secrets: the collector
      # encrypts Telegram session strings with it, and the web service
      # decrypts TOTP secrets and outbound webhook URLs with it. A value
      # Render generated for itself would be one this repository's own
      # scripts could never reproduce, so rotation and any Actions job that
      # touches an encrypted column would break.
      #
      # It is listed here, rather than left to the Environment tab, because
      # app/config.py carries a working default that is PUBLISHED IN THIS
      # REPOSITORY. Unset, nothing fails and nothing warns — the encryption
      # simply protects nothing, which is the worst of the three outcomes.
      # sync:false makes the blueprint ask for it at creation.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      # --- Live collection (app/live.py) ---------------------------------
      #
      # These four are what turn hourly collection into instant collection.
      # The web process opens its own Telegram connection and stores links
      # as they are posted, which is why credentials that previously lived
      # only in GitHub Actions secrets now have to exist here too.
      #
      # Leave LIVE_COLLECTOR_ENABLED unset and nothing changes: the app
      # boots, logs one line saying live collection is off, and the hourly
      # collector keeps working exactly as before.
      #
      # TG_SESSION_STRING is listed but is only a bootstrap. app/live.py
      # prefers the encrypted account row in the database, because that is
      # what the dashboard shows and what re-authorisation updates; this
      # value is read only by a workspace that has never registered one.
      - key: LIVE_COLLECTOR_ENABLED
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: COLLECTOR_WORKSPACE_ID
        sync: false

  # --- Collection runtime (phase 3) ----------------------------------
  #
  # NOT ENABLED. Commented deliberately, not forgotten.
  #
  # scripts/run_runtime.py is the persistent collection runtime: one
  # process, one Telegram connection per account, independent of the web
  # service's request lifecycle. It is written, tested and importable, and
  # it is the only thing that writes collection_runs and source_progress.
  # Nothing runs it today — the hourly GitHub Actions job
  # (.github/workflows/collector.yml) is still what collects in
  # production.
  #
  # Why it is commented rather than declared: a `type: worker` service has
  # no free plan, so syncing this blueprint with the block enabled starts
  # billing. That is the owner's decision to make deliberately, not a
  # side effect of merging a branch. Uncomment to make it, and confirm the
  # current plan name and price on Render's own pricing page first — the
  # value below is a placeholder, not a quote.
  #
  # Operational constraints, stated because they are not obvious:
  #   - EXACTLY ONE INSTANCE. Nothing in the runtime takes a lock. Two
  #     instances on one workspace would each start a worker per account
  #     and collect the same sources twice: the `messages` uniqueness
  #     keeps the data correct, but the duplicated Telegram traffic is
  #     real and is the fastest route to a rate limit. Do not scale this
  #     service horizontally, and do not enable autoscaling.
  #   - Render sends SIGTERM on deploy and restart; the runtime installs a
  #     handler for it and stops cleanly (finishes the in-flight message,
  #     drains its live queue, cancels the open run, disconnects). A run
  #     killed past the grace period is closed by the next start's
  #     recovery sweep, so a hard kill costs a re-read, never a gap.
  #   - A worker service gets no HTTP health check. Liveness is the
  #     process; whether collection is *working* is a different question
  #     and `scripts/check_collection.py` is what answers it.
  #   - FIELD_ENCRYPTION_KEY must be the SAME value as the web service's
  #     and the Actions secret. It decrypts the session strings this
  #     process reads; a different key strands every account row. The
  #     entrypoint refuses to start on the published default.
  #
  # - type: worker
  #   name: link-intel-runtime
  #   runtime: python
  #   plan: starter          # no free worker plan — verify current pricing
  #   region: oregon
  #   branch: main
  #   buildCommand: "pip install -r requirements.txt"
  #   startCommand: "python scripts/run_runtime.py"
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.11.9
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: link-intel-db
  #         property: connectionString
  #     - key: FIELD_ENCRYPTION_KEY
  #       sync: false
  #     - key: TG_API_ID
  #       sync: false
  #     - key: TG_API_HASH
  #       sync: false
  #     - key: COLLECTOR_WORKSPACE_ID
  #       sync: false
  #     # Optional; the defaults in scripts/run_runtime.py are bounds, not
  #     # measured capacities. Start below them, measure, then raise.
  #     - key: RUNTIME_MAX_WORKERS
  #       sync: false
  #     - key: RUNTIME_BATCH_LIMIT
  #       sync: false
  #     - key: RUNTIME_CYCLE_PAUSE
  #       sync: false

databases:
  - name: link-intel-db
    plan: free
    region: oregon
