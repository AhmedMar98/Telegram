# Render Blueprint — zero-cost deployment, native Python runtime, no Docker.
#
# Free-tier facts this blueprint is built around (verified independently
# before writing this file; see docs/01-critical-analysis.md Appendix C):
#   - Web service "free" plan: 750 instance-hours/month, sleeps after
#     ~15 minutes idle, ~1 minute cold start on the next request.
#   - Postgres "free" plan: 1 GB storage, expires 30 days after creation
#     (with a grace period) — mitigated by the weekly backup workflow in
#     .github/workflows/backup.yml, which is independent of Render.
#   - There is NO free background-worker plan. That is why the collector
#     is a scheduled GitHub Actions job (scripts/collect.py), not a
#     second Render service.
#
# Deploy: connect this repo on https://dashboard.render.com/blueprints
# and Render reads this file automatically. No Dockerfile anywhere.

services:
  - type: web
    name: link-intel-web
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Idea 187: the running code identifies itself. Render populates
      # these on every build, so nothing has to be bumped by hand at
      # release time — a version string somebody must remember to update
      # is a version string that is eventually wrong.
      - key: RENDER_GIT_COMMIT
        fromService:
          type: web
          name: link-intel-web
          envVarKey: RENDER_GIT_COMMIT
      - key: RENDER_SERVICE_NAME
        fromService:
          type: web
          name: link-intel-web
          envVarKey: RENDER_SERVICE_NAME
      - key: DATABASE_URL
        fromDatabase:
          name: link-intel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: link-intel-db
    plan: free
    region: oregon
